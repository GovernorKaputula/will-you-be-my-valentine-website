<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Be My Valentine? ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff4d6d;
      --bg: #fff0f3;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Strictly no scrolling */
      background: var(--bg);
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Floating Hearts Background */
    .heart-particle {
      position: absolute;
      color: var(--primary);
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* The Center Card */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 380px;
      z-index: 10;
      border: 1px solid white;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #c9184a;
      margin: 0.5rem 0;
    }

    /* Portrait Image Container */
    .img-container {
      width: 100%;
      height: 350px; 
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 4px solid #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
      min-height: 60px;
    }

    .btn {
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: var(--primary);
      color: white;
      z-index: 100;
      position: relative;
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      z-index: 999; /* High z-index to stay on top */
      transition: all 0.2s ease-out; /* Smooth "bouncing" movement */
      position: relative;
    }

    .hidden { display: none; }
    
    .success-msg {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: var(--primary);
      animation: pop 0.5s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
   <div id="questionArea">
      <h1>Hai HotChick, Will you be my Valentine? ❤️</h1>
	    <h1>I dare you to say no! ❤️</h1>
    </div>

  <div class="card" id="mainCard">
    <div class="img-container">
      <img id="mainImage" src="valentine.jpg" alt="Be My Valentine">
    </div>
    
    <div id="questionArea">
          <div class="button-group">
        <button id="yesBtn" class="btn">Yes!</button>
        <button id="noBtn" class="btn">No</button>
      </div>
    </div>

    <div id="successArea" class="hidden">
      <h1 class="success-msg">YAY! ❤️</h1>
      <p style="color: #555; font-weight: 500;">I knew you wouldnt resist, See you soon!</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const questionArea = document.getElementById("questionArea");
    const successArea = document.getElementById("successArea");
    const mainImg = document.getElementById("mainImage");

    let yesScale = 1;

    // 1. Floating Hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart-particle");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 400);

    // 2. Optimized "Stay-in-Frame" Runaway Logic
    function moveNoButton() {
      // Get dimensions of the button and the viewport
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      
      // Calculate max available space (with 20px safety margin)
      const maxX = window.innerWidth - btnWidth - 20;
      const maxY = window.innerHeight - btnHeight - 20;

      // Generate random coordinates within the safety zone
      const randomX = Math.floor(Math.random() * maxX) + 10;
      const randomY = Math.floor(Math.random() * maxY) + 10;

      // Apply the new position
      noBtn.style.position = "fixed";
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      // 3. Grow the Yes Button
      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    
    // Support for mobile "taps"
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // 4. Success State
    yesBtn.addEventListener("click", () => {
      questionArea.classList.add("hidden");
      successArea.classList.remove("hidden");
      mainImg.src = "valentine2.jpg"; // Your local portrait image
      
      // Cleanup
      noBtn.style.display = "none";
      yesBtn.style.display = "none";

      // Final celebration burst
      for(let i=0; i<15; i++) {
        setTimeout(createHeart, i * 100);
      }
    });
  </script>
</body>
</html>
